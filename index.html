<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5227598273240029"
     crossorigin="anonymous"></script>
    <title>Under Maintenance</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --accent-color: #007bff;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            padding: 20px;
        }

        .maintenance-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #222;
        }

        p {
            font-size: 1.1rem;
            color: #666;
            line-height: 1.6;
        }

        /* Advertisement Section */
        .ad-container {
            margin: 30px 0;
            padding: 15px;
            background: #ebebeb;
            border: 2px dashed #bbb;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90px; /* Standard Leaderboard height placeholder */
        }

        .ad-label {
            font-size: 0.75rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 5px;
        }

        /* Subscription Form */
        .subscribe-form {
            margin-top: 25px;
        }

        .subscribe-form input[type="email"] {
            padding: 12px 20px;
            width: 60%;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
        }

        .subscribe-form button {
            padding: 12px 25px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            margin-left: -45px; /* Slight overlap for pill design */
            transition: background 0.2s;
        }

        .subscribe-form button:hover {
            background-color: #0056b3;
        }

        @media (max-width: 480px) {
            .subscribe-form input[type="email"] {
                width: 100%;
                margin-bottom: 10px;
                box-sizing: border-box;
            }
            .subscribe-form button {
                width: 100%;
                margin-left: 0;
                border-radius: 25px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Main Content Card -->
        <div class="maintenance-card">
            <h1>We&rsquo;ll Be Right Back!</h1>
            <p>Our site is currently undergoing scheduled maintenance to improve your experience. We apologize for the inconvenience and should be back online shortly.</p>
            
            <!-- Subscription Form -->
            <div class="subscribe-form">
                <form action="#" method="POST"> <!-- Replace '#' with your form processing script -->
                    <input type="email" placeholder="Enter your email for updates..." required>
                    <button type="submit">Notify Me</button>
                </form>
            </div>
        </div>

        <!-- Advertisement Space -->
        <span class="ad-label">Advertisement</span>
        <div class="ad-container">
           <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5227598273240029"
     crossorigin="anonymous"></script>
<ins class="adsbygoogle"
     style="display:block; text-align:center;"
     data-ad-layout="in-article"
     data-ad-format="fluid"
     data-ad-client="ca-pub-5227598273240029"
     data-ad-slot="1683427810"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
  
        </div>
    </div>

</body>
</html>
